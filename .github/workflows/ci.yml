name: Continuous Integration

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test-typescript:
    name: TypeScript Tests
    runs-on: ubuntu-latest
    env:
      EMAIL: ${{ secrets.EMAIL }}
      PASSWORD: ${{ secrets.PASSWORD }}
      DOMAIN: ${{ secrets.DOMAIN }}

    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup Node.js
        id: setup-node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install Dependencies
        id: npm-ci
        run: npm ci

      - name: Check Format
        id: npm-format-check
        run: npm run format:check

      - name: Lint
        id: npm-lint
        run: npm run lint

      - name: Test
        id: npm-ci-test
        run: npm run ci-test

  test-action:
    name: CodeClarity Actions Test
    runs-on: ubuntu-latest
    env:
      EMAIL: ${{ secrets.EMAIL }}
      PASSWORD: ${{ secrets.PASSWORD }}
      DOMAIN: ${{ secrets.DOMAIN }}
      # PR source branch, or the pushed branch
      BRANCH_NAME: ${{ github.head_ref || github.ref_name }}

    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Test Local CodeClarity Action
        id: test-action
        uses: ./
        with:
          branch: ${{ env.BRANCH_NAME }}
          serverUrl: ${{ github.server_url }}
          projectName: ${{ github.repository }}
          analyzerName: 'JavaScript Analyzer'
          failOnCritical: false
          failOnHigh: false
          failOnMedium: false
          failOnLow: false
          failOnInfo: false

      - name: Print Output
        id: output
        env:
          VULNERABILITIES: ${{ steps.test-action.outputs.vulnerabilities }}
        run: echo "$VULNERABILITIES"
